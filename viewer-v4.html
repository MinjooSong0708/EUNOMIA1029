<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><link rel="stylesheet" href="relations.css"><link rel="stylesheet" href="eunomia.css"><style>body{overflow:hidden}#stage{height:calc(100dvh - 44px);width:100vw}canvas{display:block}.views{border-top:1px solid #222;padding-top:10px;position:absolute;bottom:0;left:20px;right:20px;display:flex;align-items:center;justify-content:flex-start;gap:5px;flex-wrap:wrap}.views button{font-weight:400;font-size:10px;padding:5px 10px}.views label{font-size:10px;display:flex;align-items:center;gap:7px}.views input{width:90px;accent-color:#111}</style></head><body><div id="stage"></div><div class="views"><button id="front">Front</button><button id="side">Side</button><button id="spin">Rotate</button></div><script type="module">
import {helmet} from './helmet-volume.js';
const h=helmet(document.querySelector('#stage'));h.zoom(.70);
for(const k of ['front','side','spin'])document.querySelector('#'+k).onclick=()=>{const active=h[k]();if(k==='spin')document.querySelector('#spin').setAttribute('aria-pressed',!!active);};
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;
if(e.data?.type==='bubble-state'){if(!Array.isArray(e.data.state?.bubbles)||e.data.state.bubbles.length>102)return;h.update(e.data.state);const ko=e.data.lang==='ko';document.documentElement.lang=ko?'ko':'en';for(const [id,en,kr] of [['front','Front','정면'],['side','Side','측면'],['spin','Rotate','자동 회전']])document.querySelector('#'+id).textContent=ko?kr:en;}
if(Number.isFinite(e.data?.focusAz))h.focus(e.data.focusAz);
if(e.data?.type==='bubble-png')h.png();
if(e.data?.type==='bubble-capture')parent.postMessage({type:'bubble-captured',image:h.capture()},location.origin);
});parent.postMessage({type:'bubble-ready'},location.origin);
</script></body></html>
