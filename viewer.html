<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><link rel="stylesheet" href="relations.css"><style>body{overflow:hidden}#stage{height:100dvh;width:100vw}canvas{display:block}.views{position:absolute;bottom:8px;left:12px;right:12px;display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}.views button{font-size:10px;padding:5px 10px}.views label{font-size:10px;display:flex;align-items:center;gap:7px}.views input{width:90px}</style></head><body><div id="stage"></div><div class="views"><button id="front">Front</button><button id="side">Side</button><button id="spin">Rotate</button><label><span id="body-label">Body</span><input id="zoom" aria-label="Body to face framing" type="range" min="0" max="100" value="80"><span id="face-label">Face</span></label></div><script type="module">
import {helmet} from './helmet.js';const h=helmet(document.querySelector('#stage'));h.zoom(.8);for(const k of ['front','side','spin'])document.querySelector('#'+k).onclick=()=>{const active=h[k]();if(k==='spin')document.querySelector('#spin').setAttribute('aria-pressed',!!active);};document.querySelector('#zoom').oninput=e=>h.zoom(+e.target.value/100);window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;if(e.data?.type==='bubble-state'){if(!Array.isArray(e.data.state?.bubbles)||e.data.state.bubbles.length>12)return;h.update(e.data.state);const ko=e.data.lang==='ko';document.documentElement.lang=ko?'ko':'en';for(const [id,en,kr] of [['front','Front','정면'],['side','Side','측면'],['spin','Rotate','자동 회전'],['body-label','Body','전신'],['face-label','Face','얼굴']])document.querySelector('#'+id).textContent=ko?kr:en;}if(e.data?.type==='bubble-png')h.png();});parent.postMessage({type:'bubble-ready'},location.origin);
</script></body></html>
